# The two root Applications for cluster sandbox-us-east-1, applied by the install pipeline after ArgoCD.
# Everything else in the cluster comes from these two folders.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gabrielguernik/gitops.git
    targetRevision: main
    path: clusters/sandbox-us-east-1/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gabrielguernik/gitops.git
    targetRevision: main
    path: clusters/sandbox-us-east-1/apps
    directory:
      include: applicationset.yaml # config/*.yaml are generator input, not manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
