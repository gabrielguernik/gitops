# Grafana Alloy, writing to the environment's Amazon Managed Prometheus workspace (SigV4 through IRSA):
# - scrapes every pod annotated prometheus.io/scrape=true (the RealWorld API, and platform pods whose charts set it);
# - reads the API load balancer's request and 5xx counts from CloudWatch. These are what users see, including the 503s
#   the ALB answers itself when no pod is ready, which never reach the app's own metrics. The error alert uses them.
#
# The workspace ID is generated by AWS and changes when the monitoring stack is recreated: after a rebuild, update
# it here and in grafana.yaml (infra SSM /sandbox/us-east-1/monitoring/amp_workspace_id). The gitops checks fail
# while it is stale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.14.0
    helm:
      valuesObject:
        crds: { create: false } # PodLogs CRD, unused
        controller:
          type: deployment # one scraper is enough for a handful of targets; no clustering
          replicas: 1
        global:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 473 # the image's alloy user
            runAsGroup: 473
            fsGroup: 473
            seccompProfile: { type: RuntimeDefault }
        serviceAccount:
          create: true
          name: alloy
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::965140467182:role/irsa/sandbox-us-east-1-alloy
        alloy:
          enableReporting: false
          extraEnv:
            - { name: AWS_REGION, value: us-east-1 } # IMDS is unreachable (hop limit 1)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          configMap:
            create: true
            content: |
              // Pods opt in with annotations: prometheus.io/scrape: "true", prometheus.io/port, prometheus.io/path.
              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "annotated" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
                  regex         = "true"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Pending|Succeeded|Failed"
                  action        = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
                  regex         = "(.+)"
                  target_label  = "__metrics_path__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
                  regex         = "(.+);(\\d+)"
                  replacement   = "$1:$2"
                  target_label  = "__address__"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
              }

              prometheus.scrape "pods" {
                targets         = discovery.relabel.annotated.output
                job_name        = "kubernetes-pods"
                scrape_interval = "30s"
                forward_to      = [prometheus.remote_write.amp.receiver]
              }

              // The API's ALB, found by the tags the load balancer controller puts on it (its ID changes on rebuild).
              prometheus.exporter.cloudwatch "alb" {
                sts_region = "us-east-1"

                decoupled_scraping {
                  enabled         = true
                  scrape_interval = "1m"
                }

                discovery {
                  type                        = "AWS/ApplicationELB"
                  regions                     = ["us-east-1"]
                  dimension_name_requirements = ["LoadBalancer"]
                  search_tags = {
                    "elbv2.k8s.aws/cluster" = "sandbox-us-east-1",
                    "ingress.k8s.aws/stack" = "realworld/realworld-api",
                  }

                  metric {
                    name       = "RequestCount"
                    statistics = ["Sum"]
                    period     = "1m"
                    length     = "5m"
                  }
                  metric {
                    name       = "HTTPCode_ELB_5XX_Count"
                    statistics = ["Sum"]
                    period     = "1m"
                    length     = "5m"
                  }
                  metric {
                    name       = "HTTPCode_Target_5XX_Count"
                    statistics = ["Sum"]
                    period     = "1m"
                    length     = "5m"
                  }
                }
              }

              prometheus.scrape "cloudwatch" {
                targets         = prometheus.exporter.cloudwatch.alb.targets
                job_name        = "cloudwatch"
                scrape_interval = "1m"
                forward_to      = [prometheus.remote_write.amp.receiver]
              }

              prometheus.remote_write "amp" {
                external_labels = { cluster = "sandbox-us-east-1" }

                endpoint {
                  url = "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-25e79335-dbf5-4520-a73b-084b8e83a935/api/v1/remote_write"

                  sigv4 {
                    region = "us-east-1"
                  }
                }
              }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
