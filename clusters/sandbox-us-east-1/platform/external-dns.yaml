# ExternalDNS: publishes Ingress hostnames in the sandbox subzone only (IAM limits it to that zone too).
# policy: sync deletes records it owns when the Ingress goes away; ownership is tracked with TXT records.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      valuesObject:
        provider: { name: aws }
        env:
          - { name: AWS_DEFAULT_REGION, value: us-east-1 }
        serviceAccount:
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::965140467182:role/irsa/sandbox-us-east-1-external-dns
        sources: [ingress]
        domainFilters: [sandbox.gg-incode.click]
        policy: sync
        registry: txt
        txtOwnerId: sandbox-us-east-1
        logFormat: json
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 128Mi }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
