# Fluent Bit: ships every container's stdout/stderr to the CloudWatch log group /eks/sandbox-us-east-1/containers
# (owned by the infra monitoring stack, 30-day retention), one log stream per <namespace>.<pod>. JSON log lines are
# merged into the record, so the API's fields (reqId, res.statusCode, responseTime, ...) are queryable in Logs
# Insights. Namespace logging is PSS privileged: Fluent Bit reads /var/log on every node.
#
# In production a centralized log system such as Loki would replace CloudWatch Logs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.3
    helm:
      valuesObject:
        serviceAccount:
          create: true
          name: fluent-bit
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::965140467182:role/irsa/sandbox-us-east-1-fluent-bit
        env:
          - { name: AWS_REGION, value: us-east-1 } # IMDS is unreachable (hop limit 1)
        resources:
          requests: { cpu: 20m, memory: 48Mi }
          limits: { memory: 128Mi }
        testFramework: { enabled: false }
        config:
          service: |
            [SERVICE]
                Daemon Off
                Flush 5
                Log_Level info
                Parsers_File /fluent-bit/etc/parsers.conf
                Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server On
                HTTP_Listen 0.0.0.0
                HTTP_Port 2020
                Health_Check On
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*.log
                Exclude_Path /var/log/containers/fluent-bit-*_logging_*.log
                multiline.parser cri
                Tag kube.*
                Mem_Buf_Limit 5MB
                Skip_Long_Lines On
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On
                Labels Off
                Annotations Off
          outputs: |
            [OUTPUT]
                Name cloudwatch_logs
                Match kube.*
                region us-east-1
                log_group_name /eks/sandbox-us-east-1/containers
                log_stream_template $kubernetes['namespace_name'].$kubernetes['pod_name']
                log_stream_prefix unknown.
                auto_create_group Off
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
