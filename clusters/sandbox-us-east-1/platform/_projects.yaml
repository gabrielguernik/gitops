# AppProjects for cluster sandbox-us-east-1. Created first (wave -10): every other Application here and every
# generated app references one of them.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster platform components (controllers, CRDs, db-bootstrap, observability). Cluster-wide permissions.
  sourceRepos:
    - git@github.com:gabrielguernik/gitops.git
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns
    - https://stakater.github.io/stakater-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://fluent.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: >-
    Workloads generated from apps/config/*.yaml. Only the listed repos, only the listed app namespaces
    (an allowlist: a new platform namespace can never be reached by an app), and no cluster-scoped resources except
    the app's own Namespace.
  sourceRepos:
    - git@github.com:gabrielguernik/realworld-app.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: realworld }
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
