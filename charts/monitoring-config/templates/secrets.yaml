{{- if not (and .Values.roleArn .Values.grafanaSecret) }}
{{- fail "roleArn and grafanaSecret are required" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  labels: {{- include "monitoring-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # before the ExternalSecret (wave -1) that authenticates as it
    eks.amazonaws.com/role-arn: {{ .Values.roleArn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
  labels: {{- include "monitoring-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
---
# Grafana reads admin-user and admin-password from this Secret (admin.existingSecret in its Application).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  labels: {{- include "monitoring-config.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: {{ .Values.grafanaSecret }}
