{{- if not (and .Values.roleArn .Values.dbInstanceArn .Values.roleSecrets.app .Values.roleSecrets.migrator) }}
{{- fail "roleArn, dbInstanceArn, roleSecrets.app and roleSecrets.migrator are required" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  labels: {{- include "db-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # before the ExternalSecrets (wave -1) that authenticate as it
    eks.amazonaws.com/role-arn: {{ .Values.roleArn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
  labels: {{- include "db-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
---
# Master credentials + both role secrets, flattened into the libpq environment and psql variables.
# Values in backtick strings are External Secrets templates, emitted literally by Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap
  labels: {{- include "db-bootstrap.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: db-bootstrap
    template:
      engineVersion: v2
      data:
        PGHOST: {{ `"{{ .migrator_host }}"` }}
        PGPORT: {{ `"{{ .migrator_port }}"` }}
        PGDATABASE: {{ `"{{ .migrator_dbname }}"` }}
        PGUSER: {{ `"{{ (.master | fromJson).username }}"` }}
        PGPASSWORD: {{ `"{{ (.master | fromJson).password }}"` }}
        APP_USER: {{ `"{{ .app_username }}"` }}
        APP_PASSWORD: {{ `"{{ .app_password }}"` }}
        MIGRATOR_USER: {{ `"{{ .migrator_username }}"` }}
        MIGRATOR_PASSWORD: {{ `"{{ .migrator_password }}"` }}
  dataFrom:
    - find:
        tags:
          aws:rds:primaryDBInstanceArn: {{ .Values.dbInstanceArn }}
      rewrite:
        - regexp: { source: "^.*$", target: master }
    - extract:
        key: {{ .Values.roleSecrets.app }}
      rewrite:
        - regexp: { source: "^(.*)$", target: "app_$1" }
    - extract:
        key: {{ .Values.roleSecrets.migrator }}
      rewrite:
        - regexp: { source: "^(.*)$", target: "migrator_$1" }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-bootstrap
  labels: {{- include "db-bootstrap.labels" . | nindent 4 }}
data:
  bootstrap.sql: |
{{ .Files.Get "files/bootstrap.sql" | indent 4 }}
  rds-ca.pem: |
{{ .Files.Get "files/rds-ca.pem" | indent 4 }}
