# Reusable: installs or upgrades ArgoCD in one cluster and applies its two root Applications.
#
# The cluster's API is private, so the job reaches it through the bastion with a Session Manager tunnel
# (scripts/eks-tunnel.sh). It runs in a GitHub environment named after the cluster: the OIDC subject is then
# ...:environment:<cluster>, the only subject role ci/argocd-<cluster> trusts, so the environment's protection
# rules (branch main only; reviewers for prod) gate every install.
name: install-argocd

on:
  workflow_call:
    inputs:
      env:
        description: Environment, e.g. sandbox
        type: string
        required: true
      region:
        description: AWS region of the cluster
        type: string
        required: true
      aws_account_id:
        type: string
        required: true
      argocd_chart_version:
        description: argo-cd Helm chart version
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  SSM_PLUGIN_VERSION: 1.2.835.0
  SSM_PLUGIN_SHA256: 7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03 # of the ubuntu_64bit .deb

jobs:
  install:
    name: ArgoCD ${{ inputs.env }}-${{ inputs.region }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}-${{ inputs.region }}
    concurrency:
      group: argocd-${{ inputs.env }}-${{ inputs.region }}
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      CLUSTER: ${{ inputs.env }}-${{ inputs.region }}
      ENV_NAME: ${{ inputs.env }}
      AWS_REGION: ${{ inputs.region }}
      SESSION_NAME: argocd-${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/ci/argocd-${{ env.CLUSTER }}
          role-session-name: ${{ env.SESSION_NAME }} # session IDs start with this; the role may only end its own
          aws-region: ${{ inputs.region }}

      - name: Install the Session Manager plugin
        run: |
          curl -fsSL -o /tmp/ssm.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/${SSM_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb"
          echo "${SSM_PLUGIN_SHA256}  /tmp/ssm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/ssm.deb
          session-manager-plugin --version

      - name: Open the tunnel to the Kubernetes API
        run: |
          scripts/eks-tunnel.sh "$ENV_NAME" "$AWS_REGION" > /tmp/tunnel.env
          # KUBECONFIG and TUNNEL_PID for later steps (no secrets); $GITHUB_ENV takes NAME=value, without "export".
          sed 's/^export //' /tmp/tunnel.env >> "$GITHUB_ENV"

      - name: ArgoCD repository credentials (from Secrets Manager)
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          for repo in gitops realworld-app; do
            aws secretsmanager get-secret-value --secret-id "${ENV_NAME}/argocd/repo-${repo}" \
              --query SecretString --output text \
            | jq '{apiVersion: "v1", kind: "Secret",
                   metadata: {name: "repo-\($repo)", namespace: "argocd",
                              labels: {"argocd.argoproj.io/secret-type": "repository"}},
                   stringData: {type: "git", url: .url, sshPrivateKey: .sshPrivateKey}}' --arg repo "$repo" \
            | kubectl apply --server-side --force-conflicts --field-manager=argocd-install -f - > /dev/null
            # Server-side apply keeps no copy of the object in an annotation. Drop the one left by the client-side
            # applies of earlier runs: it held the private key in plain text.
            kubectl -n argocd annotate secret "repo-${repo}" kubectl.kubernetes.io/last-applied-configuration- > /dev/null
            echo "repo-${repo}: applied"
          done

      - name: Install or upgrade ArgoCD
        env:
          CHART_VERSION: ${{ inputs.argocd_chart_version }}
        run: |
          # The admin password comes from Secrets Manager (generated by the infra eks stack, never in Terraform state).
          # ArgoCD stores only its bcrypt hash; htpasswd reads the password from stdin, so it's never on a command line.
          command -v htpasswd > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq apache2-utils; }
          admin_hash="$(aws secretsmanager get-secret-value --secret-id "${ENV_NAME}/argocd/${CLUSTER}/admin" \
            --query SecretString --output text | htpasswd -niBC 10 "" | tr -d ':\n')"
          echo "::add-mask::$admin_hash"
          helm upgrade --install argocd argo-cd \
            --repo https://argoproj.github.io/argo-helm --version "$CHART_VERSION" \
            --namespace argocd -f "clusters/${CLUSTER}/argocd/values.yaml" \
            -f <(jq -n --arg h "$admin_hash" '{configs: {secret: {argocdServerAdminPassword: $h}}}') \
            --wait --timeout 10m
          # The generated first-login password is no longer valid; remove it.
          kubectl -n argocd delete secret argocd-initial-admin-secret --ignore-not-found
          kubectl -n argocd get deploy,statefulset

      - name: Root Applications
        run: |
          kubectl apply -f "clusters/${CLUSTER}/argocd/roots.yaml"
          kubectl -n argocd get applications

      - name: Close the tunnel
        if: always()
        run: |
          if [[ -n "${TUNNEL_PID:-}" ]]; then kill "$TUNNEL_PID" 2>/dev/null || true; fi
          for s in $(aws ssm describe-sessions --state Active \
                       --query "Sessions[?starts_with(SessionId, '${SESSION_NAME}')].SessionId" --output text); do
            aws ssm terminate-session --session-id "$s" > /dev/null && echo "terminated $s"
          done
