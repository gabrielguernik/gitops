# Checks on every PR and on main:
#   lint        - pinned local chart tags exist; all YAML parses; the gitops charts lint; dashboards are valid JSON; every app config has the keys the ApplicationSet needs
#   references  - every AWS resource a cluster folder hardcodes still exists (scripts/check-cluster-config.sh),
#                 with the read-only role ci/gitops-check
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the chart release check
          persist-credentials: false
      - name: Local charts are released as pinned
        # Every <chart>-v<version> a cluster pins exists as a tag with that Chart.yaml version, and a chart that
        # changed since its current version's tag must get a new version.
        run: |
          rc=0
          while read -r ref; do
            chart="${ref%-v*}"; version="${ref##*-v}"
            if ! git rev-parse -q --verify "refs/tags/$ref" > /dev/null; then echo "$ref: tag missing"; rc=1; continue; fi
            [ "$(git show "$ref:charts/$chart/Chart.yaml" | yq .version)" = "$version" ] || { echo "$ref: Chart.yaml version differs"; rc=1; }
          done < <(grep -rhoE 'targetRevision: [a-z-]+-v[0-9]+\.[0-9]+\.[0-9]+' clusters | awk '{print $2}' | sort -u)
          for dir in charts/*/; do
            chart="$(basename "$dir")"; tag="$chart-v$(yq .version "$dir/Chart.yaml")"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null && ! git diff --quiet "$tag" -- "$dir"; then
              echo "$dir changed since $tag: bump the version in Chart.yaml"; rc=1
            fi
          done
          exit $rc
      # helm and yq are preinstalled on GitHub-hosted runners.
      - name: YAML parses
        run: find clusters charts -name '*.yaml' -not -path '*/templates/*' -print0 | xargs -0 -n1 yq -e 'true' > /dev/null
      - name: gitops charts
        run: |
          helm lint charts/db-bootstrap --set roleArn=x,dbInstanceArn=y,roleSecrets.app=a,roleSecrets.migrator=m
          helm lint charts/monitoring-config --set roleArn=x,grafanaSecret=y
          helm lint charts/grafana-dashboards --set cluster=c
      - name: Dashboards are valid JSON with a unique uid
        run: |
          for f in charts/grafana-dashboards/dashboards/*/*.json; do jq -e '.uid and .title' "$f" > /dev/null || { echo "$f"; exit 1; }; done
          dups=$(jq -r .uid charts/grafana-dashboards/dashboards/*/*.json | sort | uniq -d)
          [ -z "$dups" ] || { echo "duplicate dashboard uid: $dups"; exit 1; }
      - name: ApplicationSet templatePatch renders valid YAML for every app config
        # Renders the patch with Helm's engine (same Go templates and Sprig functions as ArgoCD; .x → .Values.x).
        run: |
          mkdir -p /tmp/tp/templates && printf 'apiVersion: v2\nname: tp\nversion: 0.0.1\n' > /tmp/tp/Chart.yaml
          rc=0
          for set in clusters/*/apps/applicationset.yaml; do
            yq '.spec.templatePatch' "$set" | sed 's/{{ \./{{ .Values./g; s/{{- with \./{{- with .Values./g' > /tmp/tp/templates/p.yaml
            for f in "$(dirname "$set")"/config/*.yaml; do
              helm template x /tmp/tp -f "$f" | yq -e '.spec.source.helm.valuesObject.revision' > /dev/null \
                || { echo "$f: templatePatch does not render"; rc=1; }
            done
          done
          exit $rc
      - name: App configs have the generator's keys
        run: |
          rc=0
          for f in clusters/*/apps/config/*.yaml; do
            for k in repoURL chartPath revision namespace values; do
              yq -e "has(\"$k\")" "$f" > /dev/null || { echo "$f: missing $k"; rc=1; }
            done
          done
          exit $rc

  references:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        cluster: [sandbox-us-east-1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::965140467182:role/ci/gitops-check
          aws-region: us-east-1
      - env:
          CLUSTER: ${{ matrix.cluster }}
        run: scripts/check-cluster-config.sh "$CLUSTER"
